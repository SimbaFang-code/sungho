<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>서린대학교</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="phone">
  <!-- iOS 通知弹窗 -->
  <div id="ios-notification">
    <div class="app-icon-small">💬</div>
    <div class="notif-content">
      <div class="notif-title"><span id="notif-title-text">KakaoTalk</span><span style="font-size:12px;color:#8e8e93;">现在</span></div>
      <div class="notif-body" id="notif-body-text">新消息</div>
    </div>
  </div>

  <div id="lock-screen" class="active">
    <div class="lock-time" id="lock-clock">00:00</div>
    <div class="lock-date" id="lock-date">10月26日 周一</div>
    <div class="lock-bottom"><div id="lock-prompt">点击解锁</div></div>
  </div>

  <div id="main-ui" class="hidden">
    <div id="statusbar">
      <span id="clock">9:41</span>
      <div id="island"></div>
      <span id="status-icons">5G 🔋</span>
    </div>

    <div id="screen">
      <div id="home" class="page active">
        <div class="widget-row">
          <div class="widget widget-weather">
            <div class="city">西凛大学 📍</div>
            <div class="temp">18°</div>
            <div class="desc">☀️ 多云转晴</div>
          </div>
          <div class="widget widget-photo"><div class="date">10月26日</div></div>
        </div>
        <div class="app-grid" id="app-grid"></div>
        <div class="search-bar">🔍 搜索</div>
        <div class="dock" id="dock"></div>
      </div>

      <div id="app-view" class="page">
        <div class="app-topbar">
          <button id="back-btn">‹ 返回</button>
          <span id="app-title"></span>
          <span style="width:40px"></span>
        </div>
        <div id="app-content"></div>
      </div>
    </div>
  </div>
  <div id="home-indicator"></div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
