<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>koz대학교</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="phone">
  <div id="main-ui">
    <div id="statusbar">
      <span id="clock">9:41</span>
      <div class="island"></div>
      <div class="status-right">
        <div class="signal-icon"><span></span><span></span><span></span><span></span></div>
        <div class="battery-icon"><div class="battery-level"></div></div>
      </div>
    </div>

    <div id="screen">
      <div id="home" class="page active">
        <div class="app-grid" id="app-grid"></div>
        <div class="search-bar">🔍 搜索</div>
        <div class="dock" id="dock"></div>
      </div>

      <div id="app-view" class="page">
        <div class="app-topbar">
          <button id="back-btn" onclick="goBack()">‹ 返回</button>
          <span id="app-title"></span>
          <span style="width:40px"></span>
        </div>
        <div id="app-content"></div>
      </div>
    </div>
  </div>
  <div id="home-indicator" onclick="goHome()"></div>
</div>
<script src="app.js"></script>
</body>
</html>
