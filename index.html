<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>서린대학교</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="phone">
  <!-- 顶部状态栏 -->
  <div id="statusbar">
    <span id="clock">9:41</span>
    <div class="island"></div>
    <div class="status-right">
      <div class="signal-icon"><span></span><span></span><span></span><span></span></div>
      <div class="battery-icon"><div class="battery-level"></div></div>
    </div>
  </div>

  <div id="screen">
    <!-- 桌面 -->
    <div id="home" class="page active">
      <div class="widget-row">
        <div class="widget widget-weather">
          <div class="city">西凛大学 📍</div>
          <div class="temp">18°</div>
          <div class="desc">☀️ 多云转晴</div>
        </div>
        <div class="widget widget-photo"><div class="date">10月26日</div></div>
      </div>
      <div class="app-grid" id="app-grid"></div>
      <div class="search-bar">🔍 搜索</div>
      <div class="dock" id="dock"></div>
    </div>

    <!-- 应用内页 -->
    <div id="app-view" class="page">
      <div class="app-topbar">
        <button id="back-btn" onclick="goBack()">‹ 返回</button>
        <span id="app-title"></span>
        <span style="width:40px"></span>
      </div>
      <div id="app-content"></div>
    </div>
  </div>
  
  <!-- 底部小横条，点击回桌面 -->
  <div id="home-indicator" onclick="goHome()" style="cursor: pointer;"></div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
