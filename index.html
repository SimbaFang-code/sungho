<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOYNEXTDOOR 捡手机</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="iphone">
  <div class="screen">
    <!-- 状态栏 -->
    <div class="statusbar">
      <span>10:26</span>
      <div class="status-right">
        <span>📶</span>
        <span>🔋</span>
      </div>
    </div>

    <!-- 通知弹窗 -->
    <div class="notify-popup" id="notify">
      <div style="font-weight:600;font-size:13px" id="notify-name">朴成淏</div>
      <div style="font-size:14px;margin-top:2px" id="notify-text">消息内容</div>
    </div>

    <!-- 主桌面 -->
    <div class="home" id="home">
      <div class="home-grid">

        <div class="icon-wrap" onclick="openPage('kkt')">
          <div class="icon icon-kakao">
            <div class="kakao-face"></div>
          </div>
          <div class="icon-label">KakaoTalk</div>
        </div>

        <div class="icon-wrap" onclick="openPage('insta')">
          <div class="icon icon-instagram">
            <div class="camera-outline"></div>
          </div>
          <div class="icon-label">Instagram</div>
        </div>

        <div class="icon-wrap" onclick="openPage('map')">
          <div class="icon icon-maps">
            <div class="map-layer">
              <div class="map-pin"></div>
            </div>
          </div>
          <div class="icon-label">地图</div>
        </div>

        <div class="icon-wrap" onclick="openPage('notes')">
          <div class="icon icon-notes">
            <div class="note-paper">
              <div class="note-line"></div>
              <div class="note-line"></div>
              <div class="note-line"></div>
            </div>
          </div>
          <div class="icon-label">备忘录</div>
        </div>

        <div class="icon-wrap">
          <div class="icon icon-calendar">
            <div class="calendar-month">10月</div>
            <div class="calendar-day">26</div>
          </div>
          <div class="icon-label">日历</div>
        </div>

        <div class="icon-wrap">
          <div class="icon icon-clock">
            <div class="clock-face">
              <div class="clock-hand hour"></div>
              <div class="clock-hand minute"></div>
              <div class="clock-center"></div>
            </div>
          </div>
          <div class="icon-label">时钟</div>
        </div>

        <div class="icon-wrap">
          <div class="icon icon-photos">
            <div class="photo photo-1"></div>
            <div class="photo photo-2"></div>
            <div class="photo photo-3"></div>
            <div class="photo photo-4"></div>
          </div>
          <div class="icon-label">照片</div>
        </div>

        <div class="icon-wrap">
          <div class="icon icon-weather">
            <div class="weather-sun"></div>
            <div class="weather-cloud"></div>
          </div>
          <div class="icon-label">天气</div>
        </div>

      </div>

      <!-- Dock栏 -->
      <div class="dock">
        <div class="icon-wrap">
          <div class="icon icon-phone">
            <div class="phone-receiver"></div>
          </div>
        </div>
        <div class="icon-wrap">
          <div class="icon icon-messages">
            <div class="bubble-icon"></div>
          </div>
        </div>
        <div class="icon-wrap">
          <div class="icon icon-safari">
            <div class="compass-icon">
              <div class="needle-red"></div>
              <div class="needle-white"></div>
            </div>
          </div>
        </div>
        <div class="icon-wrap">
          <div class="icon icon-settings">
            <div class="gear"></div>
          </div>
        </div>
      </div>
      <div class="home-indicator"></div>
    </div>

    <!-- 各个页面容器（Kakao、IG、地图、备忘录，JS控制） -->
    <div class="page" id="kkt">
      <div class="chat-header">KakaoTalk</div>
      <div class="chat-area" id="chatBox"></div>
      <div class="chat-input-bar">
        <input type="text" id="chatInput" readonly placeholder="选择下方回复发送">
        <button onclick="sendMsg()">发送</button>
      </div>
    </div>

    <div class="page" id="insta">
      <div class="chat-header">Instagram</div>
      <div style="padding:16px">IG页面内容</div>
    </div>

    <div class="page" id="map">
      <div class="chat-header">校园地图</div>
      <div style="padding:16px">地图打卡区域</div>
    </div>

    <div class="page" id="notes">
      <div class="chat-header">备忘录</div>
      <div style="padding:16px" id="notesBox"></div>
    </div>

  </div>
</div>

<script src="data.js"></script>
<script>
let currentChatId = "";
function openPage(pageId){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(pageId).classList.add("active");
  document.getElementById("home").style.display="none";
}
function backHome(){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("home").style.display="block";
}
// 弹窗通知
function showNotify(name,text){
  const el = document.getElementById("notify");
  document.getElementById("notify-name").innerText = name;
  document.getElementById("notify-text").innerText = text;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2800);
}
// 聊天简易逻辑，对接data.js
function openChat(chatKey){
  currentChatId = chatKey;
  const chat = GAME_DATA.chats[chatKey];
  const box = document.getElementById("chatBox");
  box.innerHTML = "";
  chat.messages.forEach(m=>{
    const div = document.createElement("div");
    div.className = m.speaker=="me" ? "bubble-me" : "bubble-other";
    div.innerText = m.text;
    box.appendChild(div);
  })
  openPage("kkt");
}
function sendMsg(){
  // 这里后续对接选项逻辑，你原来data.js配套
}
</script>
</body>
</html>
