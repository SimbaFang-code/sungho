<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>서린대학교</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="phone">
  <!-- 锁屏界面 -->
  <div id="lock-screen" class="active">
    <div class="lock-time" id="lock-clock">00:00</div>
    <div class="lock-date" id="lock-date">10月26日 周一</div>
    
    <div class="lock-bottom">
      <div id="lock-prompt">上滑解锁</div>
      <div id="lock-keypad" class="hidden">
        <div class="dots">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="keys">
          <button onclick="enterPin(1)">1</button><button onclick="enterPin(2)">2</button><button onclick="enterPin(3)">3</button>
          <button onclick="enterPin(4)">4</button><button onclick="enterPin(5)">5</button><button onclick="enterPin(6)">6</button>
          <button onclick="enterPin(7)">7</button><button onclick="enterPin(8)">8</button><button onclick="enterPin(9)">9</button>
          <button class="empty"></button><button onclick="enterPin(0)">0</button><button class="empty"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- 手机主界面 -->
  <div id="main-ui" class="hidden">
    <div id="statusbar">
      <span id="clock">9:41</span>
      <div id="island"></div>
      <span id="status-icons">5G 🔋</span>
    </div>

    <div id="screen">
      <div id="home" class="page active">
        <div class="home-header">
          <div class="home-date" id="home-date">10月26日 周六</div>
        </div>
        <div class="app-grid" id="app-grid"></div>
      </div>

      <div id="app-view" class="page">
        <div class="app-topbar">
          <button id="back-btn">‹ 返回</button>
          <span id="app-title"></span>
          <span style="width:40px"></span>
        </div>
        <div id="app-content"></div>
      </div>
    </div>

    <div id="home-indicator"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
