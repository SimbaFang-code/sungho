<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>koz대학교</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="phone">
  <div id="ios-notification">
    <div class="app-icon-small" style="background:#fee500; display:flex; justify-content:center; align-items:center; font-size:20px; border-radius:10px;">💬</div>
    <div class="notif-content">
      <div class="notif-title"><span id="notif-title-text">KakaoTalk</span><span style="font-size:12px;color:#8e8e93;">现在</span></div>
      <div class="notif-body" id="notif-body-text">新消息</div>
    </div>
  </div>

  <!-- 锁屏 -->
  <div id="lock-screen" class="active">
    <div class="lock-time" id="lock-clock">09:41</div>
    <div class="lock-date">10月26日 周一</div>
    <!-- 整个屏幕都是按钮 -->
    <div style="position: absolute; inset: 0; z-index: 99; cursor: pointer;" onclick="unlockPhone()"></div>
    <div class="lock-bottom">
      <div id="lock-prompt">点击屏幕解锁</div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="main-ui" class="hidden">
    <div id="statusbar">
      <span id="clock">9:41</span>
      <div class="island"></div>
      <div class="status-right">
        <div class="signal-icon"><span></span><span></span><span></span><span></span></div>
        <div class="battery-icon"><div class="battery-level"></div></div>
      </div>
    </div>

    <div id="screen">
      <div id="home" class="page active">
        <div class="widget-row">
          <div class="widget widget-weather">
            <div class="city">西凛大学 📍</div>
            <div class="temp">18°</div>
            <div class="desc">☀️ 多云转晴</div>
          </div>
          <div class="widget widget-photo"><div class="date">10月26日</div></div>
        </div>
        <div class="app-grid" id="app-grid"></div>
        <div class="search-bar">🔍 搜索</div>
        <div class="dock" id="dock"></div>
      </div>

      <div id="app-view" class="page">
        <div class="app-topbar">
          <button id="back-btn" onclick="goBack()">‹ 返回</button>
          <span id="app-title"></span>
          <span style="width:40px"></span>
        </div>
        <div id="app-content"></div>
      </div>
    </div>
  </div>
  
  <!-- 底部横条：点击直接回桌面 -->
  <div id="home-indicator" onclick="goHome()" style="cursor: pointer; pointer-events: auto;"></div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
